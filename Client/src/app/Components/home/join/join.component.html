<div class="bg-secondary dark:bg-primary">
  <div
    class="join py-48 flex flex-col justify-center items-center text-center text-white dark:text-black rounded-2xl overflow-hidden bg-white"
    [style.background-image]="sectionBackground()"
  >
    <h1 class="text-4xl md:text-6xl lg:text-8xl mb-10 md:mb-20" appSlideUp>
       Join the Journey
    </h1>
    <p class="mb-16 space-grotesk text-sm md:text-2xl" appSlideUp>
      Ready to begin your journey with the Quran? <br />
      Take your first free class and start reading the Quran with confidence and
      clarity
    </p>
    <div class="mb-12" appSlideUp>
      <a
        class="px-10 py-3 rounded-2xl text-text-blue bg-secondary dark:bg-black hover:bg-transparent border-2 border-double border-text-blue dark:border-black dark:text-ternary2 cursor-pointer transition"
        routerLink="/Free-Trail-Lesson"
      >
        Start My Free Trial Lesson
      </a>
    </div>
    <span class="text-xs md:text-sm space-grotesk" appSlideUp
      >No payment needed — only your intention to learn and grow.</span
    >
  </div>
</div>
